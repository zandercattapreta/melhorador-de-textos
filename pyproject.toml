[project]
name = "melhorador-textos"
version = "0.1.0"
description = "Extrai texto de PDFs de livros digitalizados e melhora a conversão (formatação e legibilidade), sem inventar conteúdo."
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.1",
    "ocrmypdf>=16.0",
    "ftfy>=6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
melhorador-textos = "melhorador_textos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
